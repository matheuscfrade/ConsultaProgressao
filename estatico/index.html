<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de progressão no navegador</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5c564c;
      --paper: #f6f1e7;
      --card: #fffdf8;
      --line: #e2d8c8;
      --green: #1f4d3a;
      --rust: #8c3a24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 "Segoe UI", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-family: Palatino, "Palatino Linotype", serif; font-size: 2.2rem; line-height: 1.1; margin: 0 0 8px; }
    h2 { margin: 0 0 12px; font-size: 1.25rem; }
    p { margin: 0 0 12px; }
    a { color: var(--green); }
    .kicker { letter-spacing: 0.04em; text-transform: uppercase; color: var(--green); font-size: 0.78rem; font-weight: 700; }
    .intro { color: var(--muted); max-width: 40rem; }
    form, .erro, .aviso, .vazio, .card, .secao, .status {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    form { display: grid; gap: 14px; padding: 18px; margin: 22px 0; }
    label { display: grid; gap: 6px; font-weight: 650; }
    input, button { font: inherit; }
    input[type="number"], input[type="file"], select {
      font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .datas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button, .download {
      border: 0; border-radius: 999px; background: var(--green); color: white;
      padding: 10px 18px; text-decoration: none; width: fit-content; cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .erro { padding: 12px 16px; border-color: var(--rust); color: var(--rust); }
    .aviso, .status { padding: 12px 16px; margin-bottom: 12px; }
    .resumo { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .resumo span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
    .secao { padding: 16px; margin: 16px 0; }
    .card { padding: 14px 16px; margin-top: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    dl { display: grid; grid-template-columns: minmax(11rem, max-content) 1fr; gap: 4px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    dd.linhas { white-space: pre-line; }
    .alerta { position: relative; display: inline-flex; margin-left: 4px; vertical-align: middle; }
    .alerta button {
      width: 0.85rem; height: 0.85rem; padding: 0; border-radius: 999px;
      border: 1px solid var(--muted); background: transparent; color: var(--muted);
      font: italic 600 0.62rem/0.85rem Georgia, "Palatino Linotype", serif; cursor: help;
    }
    .alerta .nota {
      display: none; position: absolute; z-index: 2; left: 0; top: 1.4rem;
      width: min(22rem, 70vw); margin: 0; padding: 8px 10px;
      border: 1px solid #e3c2b6; border-radius: 8px; background: #fffdf8;
      color: var(--ink); font-size: 0.85rem; font-weight: 400; line-height: 1.35;
      box-shadow: 0 8px 24px rgba(28, 25, 21, 0.12);
    }
    .alerta:hover .nota, .alerta:focus-within .nota { display: block; }
    .vazio { padding: 16px; }
    @media (max-width: 640px) {
      .datas, dl { grid-template-columns: 1fr; }
      main { padding: 20px 14px 48px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>
</head>
<body>
  <main>
    <h1>Consulta de progressão</h1>
    <p class="status" id="status">Preparando o programa no navegador…</p>
    <p class="erro" id="erro" hidden></p>

    <form id="form">
      <div class="datas">
        <label>Mês <input type="number" name="mes" min="1" max="12" required></label>
        <label>Ano <input type="number" name="ano" min="1990" max="2100" required></label>
      </div>
      <label>Servidores, CSV ou XLSX <input type="file" name="servidores" accept=".csv,.xlsx" required></label>
      <label>Afastamentos, CSV ou XLSX <input type="file" name="afastamentos" accept=".csv,.xlsx" required></label>
      <button type="submit" id="gerar" disabled>Gerar relatório</button>
    </form>
    <div id="resultado"></div>
  </main>
  <script>
    const status = document.querySelector("#status");
    const erro = document.querySelector("#erro");
    const form = document.querySelector("#form");
    const botao = document.querySelector("#gerar");
    const resultado = document.querySelector("#resultado");
    const hoje = new Date();
    form.mes.value = hoje.getMonth() + 1;
    form.ano.value = hoje.getFullYear();

    let pyodide = null;
    const campos = [
      ["SIAPE", "siape"],
      ["Situação", "situacao"],
      ["Cargo", "cargo"],
      ["Interstício", "intersticio"],
      ["Carreira", "carreira"],
      ["Efeitos financeiros", "efeitos"],
      ["Observação", "observacao"],
      ["Setor", "setor"],
      ["Chefe do Setor", "chefias", false, "Quem ocupa chefia no mesmo setor do servidor. Não é, necessariamente, a chefia imediata. Se a hierarquia sobe para outro setor, o chefe imediato pode estar lá. Por exemplo, o chefe imediato de um chefe de setor pode ser o diretor, vinculado à diretoria."],
      ["Servidores do mesmo Setor", "pares", false, "Demais servidores vinculados ao mesmo setor. Não são, necessariamente, os pares hierárquicos."],
      ["Exerce CD?", "funcao_cd", false, "Indica só se a pessoa ocupa cargo de direção na data deste arquivo. Não informa se exerceu cargo de direção durante o interstício."],
      ["Senha", "senha"],
      ["Afastamentos (período)", "afastamentos_periodo", true],
      ["Outros afastamentos", "outros_afastamentos", true],
    ];

    function escapar(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, (caractere) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[caractere]);
    }

    function mostrarErro(mensagem) {
      erro.hidden = !mensagem;
      erro.textContent = mensagem || "";
    }

    function card(item) {
      const efeitos = item.efeitos_financeiros
        ? item.efeitos_financeiros + (item.data_efeito ? ` (${item.data_efeito})` : "")
        : "—";
      const valores = { ...item, efeitos };
      const linhas = campos.map(([rotulo, chave, quebra, nota]) => `
        <dt>${escapar(rotulo)}${nota ? `<span class="alerta"><button type="button" aria-label="Sobre ${escapar(rotulo)}">i</button><span class="nota" role="tooltip">${escapar(nota)}</span></span>` : ""}</dt>
        <dd class="${quebra ? "linhas" : ""}">${escapar(valores[chave] || "—")}</dd>`).join("");
      const motivo = item.motivo ? `<dt>Motivo</dt><dd>${escapar(item.motivo)}</dd>` : "";
      return `<article class="card"><h3>${escapar(item.servidor)}</h3><dl>${linhas}${motivo}</dl></article>`;
    }

    function desenhar(dados) {
      const registros = dados.registros || [];
      const noMes = registros.filter((item) => item.grupo === "No mês");
      const naoCalculado = registros.filter((item) => item.grupo === "Não calculado");
      const avisos = (dados.avisos || []).map((aviso) => `<p class="aviso">${escapar(aviso)}</p>`).join("");
      const secao = (titulo, itens) => itens.length
        ? `<section class="secao"><h2>${titulo}</h2>${itens.map(card).join("")}</section>`
        : "";
      const vazio = noMes.length ? "" : `<p class="vazio">Nenhuma progressão neste mês.</p>`;
      resultado.innerHTML = `
        ${avisos}
        <div class="resumo"><span>No mês: ${noMes.length}</span><span>Não calculado: ${naoCalculado.length}</span></div>
        <button type="button" class="download" id="baixar">Baixar Excel</button>
        ${vazio}
        ${secao("No mês", noMes)}
        ${secao("Não calculado", naoCalculado)}`;
      document.querySelector("#baixar").addEventListener("click", () => {
        const binario = Uint8Array.from(atob(dados.excel_b64), (caractere) => caractere.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([binario], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        }));
        const link = document.createElement("a");
        link.href = url;
        link.download = "relatorio_progressoes.xlsx";
        link.click();
        URL.revokeObjectURL(url);
      });
    }

    async function preparar() {
      try {
        pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.5/full/" });
        await pyodide.loadPackage(["pandas", "micropip"]);
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("openpyxl");
        const aqui = new URL(window.location.href);
        if (!aqui.pathname.endsWith("/")) aqui.pathname = aqui.pathname.replace(/[^/]*$/, "");
        for (const nome of ["leitura.py", "carreira.py", "relatorio.py", "navegador.py"]) {
          const resposta = await fetch(new URL(`codigo/${nome}`, aqui));
          if (!resposta.ok) throw new Error(`Não consegui carregar ${nome}.`);
          pyodide.FS.writeFile(nome, await resposta.text());
        }
        status.textContent = "Pronto. Os arquivos ficam neste navegador.";
        botao.disabled = false;
      } catch (falha) {
        status.textContent = "Não consegui preparar o programa no navegador.";
        mostrarErro(String(falha.message || falha));
      }
    }

    function prepararArquivos() {
      const servidores = form.servidores.files[0];
      const afastamentos = form.afastamentos.files[0];
      return Promise.all([servidores.arrayBuffer(), afastamentos.arrayBuffer()]).then(([serv, afast]) => {
        pyodide.globals.set("serv_bytes", new Uint8Array(serv));
        pyodide.globals.set("afast_bytes", new Uint8Array(afast));
        pyodide.globals.set("nome_serv", servidores.name);
        pyodide.globals.set("nome_afast", afastamentos.name);
        pyodide.globals.set("mes_ref", Number(form.mes.value));
        pyodide.globals.set("ano_ref", Number(form.ano.value));
      });
    }

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if (!pyodide) return;
      mostrarErro("");
      resultado.innerHTML = "";
      botao.disabled = true;
      status.textContent = "Calculando neste navegador…";
      try {
        await prepararArquivos();
        const bruto = pyodide.runPython(`
import navegador
navegador.processar(serv_bytes, nome_serv, afast_bytes, nome_afast, mes_ref, ano_ref)
`);
        const dados = JSON.parse(bruto);
        if (!dados.ok) {
          mostrarErro(dados.erro);
          return;
        }
        desenhar(dados);
        status.textContent = "Relatório gerado neste navegador. As planilhas não foram enviadas para nenhum servidor externo.";
      } catch (falha) {
        mostrarErro(String(falha.message || falha));
        status.textContent = "Não consegui gerar o relatório.";
      } finally {
        botao.disabled = false;
      }
    });

    preparar();
  </script>
</body>
</html>
